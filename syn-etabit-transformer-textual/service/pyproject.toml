[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docstream-cpu"
version = "0.2.0.dev4"
description = "Syn-Etabit Transformer — Textual compatibility CPU model and reference service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.1", "mcp==2.3.0", "uvicorn==0.38.0", "playwright==1.64.1", "pywin32==312; platform_system == 'Windows'", "markdown-it-py==4.2.0", "python-docx==1.2.0", "Pillow==12.3.0", "lxml==6.1.1"]

[project.scripts]
docstream-local = "docstream_cpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

